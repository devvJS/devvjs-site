<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 100" preserveAspectRatio="xMidYMid meet">
  <style>
    .brace { fill: #39ff14; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-weight: 700; }
    .name  { fill: #e2e8f0; font-family: 'JetBrains Mono', 'Fira Code', monospace; font-weight: 500; }
    .cursor { fill: #39ff14; animation: blink 1s steps(2, start) infinite; }
