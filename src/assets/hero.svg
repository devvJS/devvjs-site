  </style>
  <text x="50%" y="50%" text-anchor="middle" dominant-baseline="central" font-size="64">
    <tspan class="brace">{</tspan><tspan class="name">devvJS</tspan><tspan class="brace">}</tspan><tspan class="cursor" dx="4">█</tspan>
  </text>
</svg>